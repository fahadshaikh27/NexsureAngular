<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark">NS</span>
      <span>NexSure</span>
    </div>

    <nav class="nav" aria-label="Main navigation">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }">
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>
  </aside>

  <section class="main">
    <header class="topbar">
      <div>
        <strong>API Consumption Workspace</strong>
        <span>Module teams can build screens independently.</span>
      </div>
      <button class="logout-button" type="button" (click)="logout()">Logout</button>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </section>
</div>
